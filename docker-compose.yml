version: '3.8'

services:
  backend:
    build: ./backend
    container_name: movieticket_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/movieticket
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: movieticket_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: movieticket_redis
    ports:
      - "6379:6379"
    restart: always

  mongo:
    image: mongo:6.0
    container_name: movieticket_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
