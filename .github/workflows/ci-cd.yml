# ==============================================================================
# GitHub Actions Continuous Integration & Continuous Deployment (CI/CD)
# Project: ShowTime Movie Ticket Booking System
# ==============================================================================

name: ShowTime Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------------------------
  # JOB 1: Static Quality, Syntax & Build Verification (Tier 0)
  # ----------------------------------------------------------------------------
  code-quality-and-build:
    name: 🔍 Tier 0 - Syntax & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build


  # ----------------------------------------------------------------------------
  # JOB 2: Backend Integration & Route Contract Tests (Tier 1 & 3)
  # ----------------------------------------------------------------------------
  backend-integration-tests:
    name: 🧪 Tier 1 & 3 - Backend Integration (Jest + Supertest)
    runs-on: ubuntu-latest
    needs: code-quality-and-build

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run In-Process Integration Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: ci_test_jwt_secret_key_12345
          STRIPE_SECRET_KEY: sk_test_mock_stripe_ci_runner_key
          MONGODB_URI: mongodb://localhost:27017/showtime_test

      - name: Run Code Coverage
        working-directory: backend
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_12345
          STRIPE_SECRET_KEY: sk_test_mock_stripe_ci_runner_key

      - name: Archive Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 7


  # ----------------------------------------------------------------------------
  # JOB 3: Frontend Browser E2E Automation (Tier 4)
  # ----------------------------------------------------------------------------
  frontend-browser-e2e:
    name: 🎭 Tier 4 - Frontend E2E Automation (Playwright)
    runs-on: ubuntu-latest
    needs: code-quality-and-build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright Chromium & System Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests Headlessly
        working-directory: frontend
        run: npm run test:e2e

      - name: Archive Playwright Test Report (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: frontend/playwright-report/
          retention-days: 14


  # ----------------------------------------------------------------------------
  # JOB 4: Automated Continuous Deployment (CD)
  # Triggered ONLY when all test tiers pass AND on the 'main' production branch
  # ----------------------------------------------------------------------------
  deploy-production:
    name: 🚀 Tier-1 Continuous Deployment (Render & Vercel)
    runs-on: ubuntu-latest
    needs: [code-quality-and-build, backend-integration-tests, frontend-browser-e2e]
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Trigger Render Backend Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render backend deployment hook..."
            HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
            echo "Render hook responded with HTTP $HTTP_RESPONSE"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping Render deployment."
          fi

      - name: Trigger Vercel Frontend Deployment
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Vercel frontend deployment hook..."
            HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
            echo "Vercel hook responded with HTTP $HTTP_RESPONSE"
          else
            echo "VERCEL_DEPLOY_HOOK_URL secret not set, skipping Vercel deployment."
          fi
